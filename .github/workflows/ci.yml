name: FE CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - name: Validate pull request branch and issue
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          if [ "$BASE_REF" = "main" ] && [ "$HEAD_REF" = "dev" ]; then
            exit 0
          fi

          if [ "$BASE_REF" != "dev" ]; then
            echo "::error::Pull requests to main must come from dev. Feature work targets dev."
            exit 1
          fi

          if [[ ! "$HEAD_REF" =~ ^(feat|fix|chore|docs|refactor|test)/([1-9][0-9]*)-[a-z0-9]+(-[a-z0-9]+)*$ ]]; then
            echo "::error::Use a branch such as feat/123-booth-search."
            exit 1
          fi

          issue_number="${HEAD_REF#*/}"
          issue_number="${issue_number%%-*}"
          if [[ ! "$PR_BODY" =~ (Closes|Fixes|Resolves)[[:space:]]+\#${issue_number}([[:space:]]|$) ]]; then
            echo "::error::Link issue #${issue_number} in the PR body with Closes #${issue_number}."
            exit 1
          fi

      - uses: actions/checkout@v4

      - name: Detect React/Vite project
        id: app
        shell: bash
        run: |
          if [ ! -f package.json ]; then
            echo "::notice::Frontend source has not been added yet; npm checks are skipped."
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ ! -f package-lock.json ]; then
            echo "::error::Commit package-lock.json so npm ci can install reproducibly."
            exit 1
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        if: steps.app.outputs.ready == 'true'
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        if: steps.app.outputs.ready == 'true'
        run: npm ci

      - name: Lint
        if: steps.app.outputs.ready == 'true'
        run: npm run lint --if-present

      - name: Test
        if: steps.app.outputs.ready == 'true'
        run: CI=true npm test --if-present

      - name: Build
        if: steps.app.outputs.ready == 'true'
        run: npm run build
