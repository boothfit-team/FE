name: FE CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Detect React/Vite project
        id: app
        shell: bash
        run: |
          if [ ! -f package.json ]; then
            echo "::notice::Frontend source has not been added yet; npm checks are skipped."
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ ! -f package-lock.json ]; then
            echo "::error::Commit package-lock.json so npm ci can install reproducibly."
            exit 1
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        if: steps.app.outputs.ready == 'true'
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        if: steps.app.outputs.ready == 'true'
        run: npm ci

      - name: Lint
        if: steps.app.outputs.ready == 'true'
        run: npm run lint --if-present

      - name: Test
        if: steps.app.outputs.ready == 'true'
        run: CI=true npm test --if-present

      - name: Build
        if: steps.app.outputs.ready == 'true'
        run: npm run build
